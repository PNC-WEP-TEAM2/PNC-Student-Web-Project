<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard | Synergy</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/pages/dashboard.css"></head><body>
<header class="site-header"><div class="container navbar"><a class="brand" href="../index.html"><span class="brand-mark"></span>Synergy</a><nav aria-label="Main navigation"><ul class="nav-links"><li><a href="../index.html">Home</a></li><li><a href="about.html">About Us</a></li><li><a href="members.html">Team Members</a></li><li><a href="tasks.html">Tasks</a></li><li><a class="nav-icon-link" href="login.html" aria-label="Login" title="Login"><span class="nav-icon" aria-hidden="true">&#8618;</span></a></li></ul></nav></div></header>
<main class="site-main"><div class="container"><div class="dashboard-header"><div><span class="eyebrow">Admin console</span><h1>Team dashboard</h1><p>Keep the people and the project moving together.</p></div><div class="dashboard-actions"><div class="user-status"><strong id="currentUsername">Guest</strong><span id="currentRole">Not signed in</span></div><button class="btn btn-quiet" type="button" onclick="logout()">Log out</button></div></div><div class="auth-warning" id="authWarning" hidden></div><div class="dashboard-stats"><div class="stat-card"><span>Team size</span><strong id="memberCount">0</strong></div><div class="stat-card"><span>Workspace</span><strong>Active</strong></div><div class="stat-card"><span>Access</span><strong id="accessLevel">View only</strong></div></div><div class="dashboard-layout"><aside class="panel admin-only"><h3>Add a member</h3><form id="memberForm"><div class="form-field"><label for="memberName">Name</label><input id="memberName" type="text" required placeholder="Full name"></div><div class="form-field"><label for="memberRole">Role</label><input id="memberRole" type="text" required placeholder="Team role"></div><button class="btn btn-primary" type="submit">Add member</button></form></aside><section class="panel"><h3>Current team</h3><div class="table-wrap"><table class="member-table"><thead><tr><th>Name</th><th>Role</th><th>Action</th></tr></thead><tbody id="memberRows"></tbody></table></div></section></div></div></main>
<footer class="site-footer"><div class="container"><div class="footer-bottom"><span>© 2026 Synergy Team</span><span>Workspace access</span></div></div></footer><script src="../js/auth.js"></script><script src="../js/members.js"></script></body></html>
